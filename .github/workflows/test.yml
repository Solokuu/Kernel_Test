name: Realme 8 NetHunter Kernel Builder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["LineageOS-20"]

    env:
      VERSION: ${{ matrix.version }}
      ARCH: arm64
      KBUILD_BUILD_HOST: Github-Action
      KBUILD_BUILD_USER: "Kernel_Builder"
      CLANG_PATH: ${{ github.workspace }}/kernel/clang/bin
      DRIVERS_CONFIG: "${{ github.workspace }}/drivers.cfg"
      DEVICE_CODENAME: nashc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip jq libarchive-tools zip lib32z1-dev libbz2-dev pngcrush python-is-python3 libsdl1.2-dev autoconf libxml2-utils wget pkg-config unzip gawk imagemagick libc6-dev gcc-multilib patchelf gzip clang subversion optipng device-tree-compiler ccache gcc lzip rsync automake fastboot patch pngquant expat lzop libswitch-perl make libcap-dev adb libxml2 bison zlib1g-dev libtool squashfs-tools gperf flex libtinfo6 minicom liblz4-tool libmpfr-dev libssl-dev build-essential cmake g++-multilib re2c axel maven xsltproc g++ git git-lfs policycoreutils unrar ncurses-dev tree bc curl software-properties-common tar texinfo schedtool libc6-dev-i386 apt-utils
          pip install yq --user

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Clone sources
        run: |
          chmod +x clone.sh
          ./clone.sh

      - name: Add Clang to PATH
        run: |
          echo "${CLANG_PATH}" >> $GITHUB_PATH

      - name: Add NetHunter config
        run: |
          echo "# NetHunter Core Config" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_OVERLAY_FS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_LIBCOMPOSITE=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_HID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_HID_GENERIC=y" >> ${{ env.DRIVERS_CONFIG }}

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create basic flashable zip
        run: |
          mkdir -p nethunter-package/META-INF/com/google/android
          
          # Create minimal updater script
          cat > nethunter-package/META-INF/com/google/android/updater-script <<'EOF'
          ui_print("Custom NetHunter for Realme 8");
          package_extract_file("Image.gz-dtb", "/dev/block/bootdevice/by-name/boot");
          ui_print("Installation complete!");
          EOF
          
          # Get simple update-binary
          wget https://raw.githubusercontent.com/LineageOS/android_bootable_recovery/lineage-20/prebuilt/update-binary -O nethunter-package/META-INF/com/google/android/update-binary
          
          # Copy kernel image
          cp kernel/out/arch/arm64/boot/Image.gz-dtb nethunter-package/
          
          # Create zip
          cd nethunter-package
          zip -r9 ../nethunter-${{ env.DEVICE_CODENAME }}.zip *
          echo "KERNEL_ZIP=nethunter-${{ env.DEVICE_CODENAME }}.zip" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nethunter-${{ env.DEVICE_CODENAME }}.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
          token: ${{ secrets.GITHUB_TOKEN }}
          name: NetHunter ${{ env.VERSION }}
          tag_name: nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d)
          body: |
            **Custom NetHunter Kernel for Realme 8**
            
            **Includes:**
            - All NetHunter kernel features
            - Pre-configured drivers
            
            **Installation:**
            1. Flash zip in recovery
            2. For modules: manually copy .ko files to /system/lib/modules
          draft: false
          prerelease: false
