name: Realme 8 NetHunter Kernel Builder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["LineageOS-20"]

    env:
      VERSION: ${{ matrix.version }}
      ARCH: arm64
      KBUILD_BUILD_HOST: Github-Action
      KBUILD_BUILD_USER: "NetHunter_Builder"
      CLANG_PATH: ${{ github.workspace }}/kernel/clang/bin
      DEVICE_CODENAME: nashc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip jq libarchive-tools zip lib32z1-dev libbz2-dev pngcrush python-is-python3 libsdl1.2-dev autoconf libxml2-utils wget pkg-config unzip gawk imagemagick libc6-dev gcc-multilib patchelf gzip clang subversion optipng device-tree-compiler ccache gcc lzip rsync automake fastboot patch pngquant expat lzop libswitch-perl make libcap-dev adb libxml2 bison zlib1g-dev libtool squashfs-tools gperf flex libtinfo6 minicom liblz4-tool libmpfr-dev libssl-dev build-essential cmake g++-multilib re2c axel maven xsltproc g++ git git-lfs policycoreutils unrar ncurses-dev tree bc curl software-properties-common tar texinfo schedtool libc6-dev-i386 apt-utils
          sudo pip3 install yq

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          mkdir -p ${{ github.workspace }}/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Clone toolchains and kernel sources
        run: |
          chmod +x clone.sh
          ./clone.sh

      - name: Add Clang to PATH
        run: |
          echo "${CLANG_PATH}" >> $GITHUB_PATH

      - name: Clone Kali NetHunter Kernel Builder
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git nethunter-builder

      - name: Apply NetHunter patches
        run: |
          cd kernel
          for patch in nethunter-builder/patches/*.patch; do
            patch -p1 < $patch || true
          done

      - name: Configure kernel
        run: |
          cd kernel
          make O=out ARCH=${{ env.ARCH }} CC="${{ env.CLANG_PATH }}/clang" nashc_defconfig
          # Basic NetHunter config
          ./scripts/config --file out/.config \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_USB_CONFIGFS_F_HID \
            --enable CONFIG_HID \
            --enable CONFIG_USB_CONFIGFS \
            --enable CONFIG_USB_LIBCOMPOSITE \
            --enable CONFIG_CONFIGFS_FS \
            --enable CONFIG_USB_GADGET

      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC="${{ env.CLANG_PATH }}/clang"
          cp out/arch/arm64/boot/Image.gz-dtb ${{ github.workspace }}/Image.gz-dtb

      - name: Package NetHunter kernel
        run: |
          cd nethunter-builder
          mkdir -p out
          cp ${{ github.workspace }}/Image.gz-dtb out/
          ./build.sh --device ${{ env.DEVICE_CODENAME }} --kernel ${{ github.workspace }}/Image.gz-dtb

      - name: Make a release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nethunter-builder/out/*.zip
            nethunter-builder/out/*.img
          token: ${{ secrets.GITHUB_TOKEN }}
          name: NetHunter Kernel - ${{ env.DEVICE_CODENAME }} - ${{ env.VERSION }}
          tag_name: nethunter-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          body: |
            **NetHunter Kernel for Realme 8 (nashc)**
            
            **Build Info:**
            - Kernel Version: ${{ env.VERSION }}
            - Device: ${{ env.DEVICE_CODENAME }}
            
            **Installation:**
            1. Flash the zip file in custom recovery
            2. Reboot
          draft: false
          prerelease: false
