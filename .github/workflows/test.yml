name: Realme 8 NetHunter Kernel Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["LineageOS-20"]

    env:
      VERSION: ${{ matrix.version }}
      ARCH: arm64
      DEVICE_CODENAME: nashc
      CLANG_PATH: ${{ github.workspace }}/kernel/clang/bin
      DRIVERS_CONFIG: "${{ github.workspace }}/drivers.cfg"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip jq zip unzip wget bc build-essential \
          ccache clang cmake flex g++ gcc git libncurses-dev libssl-dev \
          make python3 python3-dev rsync sed tar zlib1g-dev
          pip install yq --user

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          mkdir -p ${{ github.workspace }}/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Clone kernel sources
        run: |
          chmod +x clone.sh
          ./clone.sh

      - name: Add NetHunter config
        run: |
          echo "# NetHunter Core Config" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_OVERLAY_FS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_ATH9K_HTC=y" >> ${{ env.DRIVERS_CONFIG }}
          echo 'CONFIG_ATH9K_HTC_FW_PATH="ath9k_htc/htc_9271-1.4.0.fw"' >> ${{ env.DRIVERS_CONFIG }}

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Prepare NetHunter package
        run: |
          # Create directory structure
          mkdir -p nethunter-package/{META-INF/com/google/android,system/lib/modules,system/etc/firmware/ath9k_htc}
          
          # Create minimal update-binary
          cat > nethunter-package/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh
          OUTFD=$2
          ui_print() { echo -e "ui_print $1\n" > /proc/self/fd/$OUTFD; }
          
          ui_print "Installing NetHunter for Realme 8"
          mount /system || ui_print "Warning: Could not mount /system"
          
          # Flash kernel
          dd if=/tmp/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot && ui_print "Kernel flashed" || ui_print "Flash failed!"
          
          # Install firmware
          mkdir -p /system/etc/firmware/ath9k_htc
          cp /tmp/system/etc/firmware/ath9k_htc/htc_9271-1.4.0.fw /system/etc/firmware/ath9k_htc/
          chmod 0644 /system/etc/firmware/ath9k_htc/htc_9271-1.4.0.fw
          
          umount /system 2>/dev/null
          ui_print "Installation complete"
          EOF
          chmod +x nethunter-package/META-INF/com/google/android/update-binary
          
          # Download WiFi firmware
          wget https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw -O nethunter-package/system/etc/firmware/ath9k_htc/htc_9271-1.4.0.fw
          
          # Copy kernel image
          cp kernel/out/arch/arm64/boot/Image.gz-dtb nethunter-package/
          
          # Copy kernel modules
          find kernel/out -name "*.ko" -exec cp {} nethunter-package/system/lib/modules/ \;
          
          # Create updater-script
          cat > nethunter-package/META-INF/com/google/android/updater-script <<'EOF'
          ui_print("NetHunter Installer");
          package_extract_file("Image.gz-dtb", "/tmp/Image.gz-dtb");
          package_extract_dir("system", "/tmp/system");
          run_program("/META-INF/com/google/android/update-binary", "dummy_arg", "1");
          EOF

      - name: Create flashable zip
        run: |
          cd nethunter-package
          zip -r9 ../nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d).zip *
          echo "FLASHABLE_ZIP=nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d).zip" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nethunter-${{ env.DEVICE_CODENAME }}-*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          name: NetHunter ${{ env.VERSION }} ($(date +%Y-%m-%d))
          tag_name: nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d)
          body: |
            **NetHunter Kernel for Realme 8 (nashc)**
            
            **Includes:**
            - Kernel with NetHunter patches
            - ath9k_htc firmware (AR9271 support)
            - All required kernel modules
            
            **Installation:**
            1. Flash in TWRP recovery
            2. Reboot
            
            **Note:** For WiFi injection, use compatible USB adapters
          draft: false
          prerelease: false
