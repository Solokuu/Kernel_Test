name: Realme 8 NetHunter Kernel Builder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["LineageOS-20"]

    env:
      VERSION: ${{ matrix.version }}
      ARCH: arm64
      KBUILD_BUILD_HOST: Github-Action
      KBUILD_BUILD_USER: "Kernel_Builder"
      CLANG_PATH: ${{ github.workspace }}/kernel/clang/bin
      DRIVERS_CONFIG: "${{ github.workspace }}/drivers.cfg"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip jq libarchive-tools zip lib32z1-dev libbz2-dev pngcrush python-is-python3 libsdl1.2-dev autoconf libxml2-utils wget pkg-config unzip gawk imagemagick libc6-dev gcc-multilib patchelf gzip clang subversion optipng device-tree-compiler ccache gcc lzip rsync automake fastboot patch pngquant expat lzop libswitch-perl make libcap-dev adb libxml2 bison zlib1g-dev libtool squashfs-tools gperf flex libtinfo6 minicom liblz4-tool libmpfr-dev libssl-dev build-essential cmake g++-multilib re2c axel maven xsltproc g++ git git-lfs policycoreutils unrar ncurses-dev tree bc curl software-properties-common tar texinfo schedtool libc6-dev-i386 apt-utils
          sudo pip3 install yq

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Clone clang and kernel sources
        run: |
          chmod +x clone.sh
          ./clone.sh

      - name: Add Clang to PATH
        run: |
          echo "${CLANG_PATH}" >> $GITHUB_PATH

      - name: Add NetHunter config to drivers.cfg
        run: |
          echo "# NetHunter required options" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_OVERLAY_FS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_LIBCOMPOSITE=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_HID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_HID_GENERIC=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_HIDRAW=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_UHID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_CONFIGFS_FS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_GADGET=y" >> ${{ env.DRIVERS_CONFIG }}

      - name: Compile kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create basic NetHunter package
        run: |
          mkdir -p nethunter-package
          cp kernel/out/arch/arm64/boot/Image.gz-dtb nethunter-package/
          echo "Creating flashable zip..."
          cd nethunter-package
          zip -r9 nethunter-kernel.zip *
          echo "Package created!"

      - name: Make a release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            nethunter-package/nethunter-kernel.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Kernel Release - ${{ env.VERSION }}
          tag_name: ${{ github.run_id }}
          body: |
             **Custom NetHunter Kernel for Realme 8**
             
             **Info:**
             - Version: ${{ env.VERSION }}
             - Includes NetHunter functionality
             - Custom drivers from drivers.cfg
             
             **Installation:**
             1. Kernel only: flash Image.gz-dtb
             2. Full package: flash nethunter-kernel.zip
             
             **Note:** Custom build, not officially supported
          draft: false
          prerelease: false
