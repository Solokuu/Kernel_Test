name: Realme 8 Full NetHunter Kernel Builder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["LineageOS-20"]

    env:
      VERSION: ${{ matrix.version }}
      ARCH: arm64
      KBUILD_BUILD_HOST: Github-Action
      KBUILD_BUILD_USER: "Kernel_Builder"
      CLANG_PATH: ${{ github.workspace }}/kernel/clang/bin
      DRIVERS_CONFIG: "${{ github.workspace }}/drivers.cfg"
      DEVICE_CODENAME: nashc
      NH_DIR: "${{ github.workspace }}/nethunter"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip jq libarchive-tools zip lib32z1-dev libbz2-dev pngcrush python-is-python3 libsdl1.2-dev autoconf libxml2-utils wget pkg-config unzip gawk imagemagick libc6-dev gcc-multilib patchelf gzip clang subversion optipng device-tree-compiler ccache gcc lzip rsync automake fastboot patch pngquant expat lzop libswitch-perl make libcap-dev adb libxml2 bison zlib1g-dev libtool squashfs-tools gperf flex libtinfo6 minicom liblz4-tool libmpfr-dev libssl-dev build-essential cmake g++-multilib re2c axel maven xsltproc g++ git git-lfs policycoreutils unrar ncurses-dev tree bc curl software-properties-common tar texinfo schedtool libc6-dev-i386 apt-utils android-sdk-libsparse-utils android-sdk-ext4-utils
          sudo pip3 install yq

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Clone sources
        run: |
          chmod +x clone.sh
          ./clone.sh
          git clone --depth=1 https://github.com/offensive-security/nethunter-devices.git ${{ env.NH_DIR }}

      - name: Add Clang to PATH
        run: |
          echo "${CLANG_PATH}" >> $GITHUB_PATH

      - name: Apply NetHunter config
        run: |
          echo "Applying NetHunter configuration..."
          cat ${{ env.NH_DIR }}/common/configs/nethunter.cfg >> ${{ env.DRIVERS_CONFIG }}
          cat ${{ env.NH_DIR }}/common/configs/essential.cfg >> ${{ env.DRIVERS_CONFIG }}

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Prepare NetHunter files
        run: |
          mkdir -p nethunter-package/{META-INF/com/google/android,system/lib/modules}
          
          # Copy kernel image
          cp kernel/out/arch/arm64/boot/Image.gz-dtb nethunter-package/
          
          # Copy modules
          find kernel/out -name "*.ko" -exec cp {} nethunter-package/system/lib/modules/ \;
          
          # NetHunter specific files
          cp -r ${{ env.NH_DIR }}/common/system/* nethunter-package/system/
          cp ${{ env.NH_DIR }}/devices/${{ env.DEVICE_CODENAME }}/fstab.* nethunter-package/ 2>/dev/null || :
          
          # Create updater script
          cat > nethunter-package/META-INF/com/google/android/updater-script <<EOF
          ui_print("Installing NetHunter for Realme 8");
          show_progress(0.750000, 0);
          ui_print("Extracting system...");
          package_extract_dir("system", "/system");
          ui_print("Installing kernel...");
          package_extract_file("Image.gz-dtb", "/dev/block/bootdevice/by-name/boot");
          ui_print("Setting permissions...");
          set_metadata_recursive("/system", "uid", 0, "gid", 0, "dmode", 0755, "fmode", 0644);
          set_metadata_recursive("/system/lib/modules", "uid", 0, "gid", 0, "dmode", 0755, "fmode", 0644);
          ui_print("Installation complete!");
          EOF
          
          # Get update-binary
          wget https://raw.githubusercontent.com/topjohnwu/Magisk/master/scripts/update-binary.sh -O nethunter-package/META-INF/com/google/android/update-binary

      - name: Create flashable zip
        run: |
          cd nethunter-package
          zip -r9 nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d).zip *
          echo "FLASHABLE_ZIP=nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d).zip" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nethunter-package/*.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
          token: ${{ secrets.GITHUB_TOKEN }}
          name: NetHunter ${{ env.VERSION }} ($(date +%Y-%m-%d))
          tag_name: nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d)
          body: |
            **Full NetHunter for Realme 8 (nashc)**
            
            **Includes:**
            - Custom kernel with all NetHunter patches
            - Required kernel modules
            - NetHunter base system files
            - Proper device configuration
            
            **Installation:**
            1. Flash zip in custom recovery
            2. Reboot and enjoy NetHunter!
            
            **Note:** This is a community build
          draft: false
          prerelease: false
