name: Realme 8 Custom NetHunter Kernel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["LineageOS-20"]

    env:
      VERSION: ${{ matrix.version }}
      ARCH: arm64
      KBUILD_BUILD_HOST: Github-Action
      KBUILD_BUILD_USER: "Kernel_Builder"
      CLANG_PATH: ${{ github.workspace }}/kernel/clang/bin
      DRIVERS_CONFIG: "${{ github.workspace }}/drivers.cfg"
      DEVICE_CODENAME: nashc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip jq libarchive-tools zip lib32z1-dev libbz2-dev pngcrush python-is-python3 libsdl1.2-dev autoconf libxml2-utils wget pkg-config unzip gawk imagemagick libc6-dev gcc-multilib patchelf gzip clang subversion optipng device-tree-compiler ccache gcc lzip rsync automake fastboot patch pngquant expat lzop libswitch-perl make libcap-dev adb libxml2 bison zlib1g-dev libtool squashfs-tools gperf flex libtinfo6 minicom liblz4-tool libmpfr-dev libssl-dev build-essential cmake g++-multilib re2c axel maven xsltproc g++ git git-lfs policycoreutils unrar ncurses-dev tree bc curl software-properties-common tar texinfo schedtool libc6-dev-i386 apt-utils
          sudo pip3 install yq

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Clone clang and kernel sources
        run: |
          chmod +x clone.sh
          ./clone.sh

      - name: Add Clang to PATH
        run: |
          echo "${CLANG_PATH}" >> $GITHUB_PATH

      - name: Configure NetHunter kernel options
        run: |
          cd kernel
          make O=out ARCH=${{ env.ARCH }} CC="${{ env.CLANG_PATH }}/clang" nashc_defconfig
          # NetHunter essential configs
          ./scripts/config --file out/.config \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_USB_CONFIGFS \
            --enable CONFIG_USB_CONFIGFS_F_HID \
            --enable CONFIG_USB_LIBCOMPOSITE \
            --enable CONFIG_HID \
            --enable CONFIG_HID_GENERIC \
            --enable CONFIG_HIDRAW \
            --enable CONFIG_UHID \
            --enable CONFIG_CONFIGFS_FS \
            --enable CONFIG_USB_GADGET \
            --enable CONFIG_NETFILTER_XT_TARGET_CT \
            --enable CONFIG_NF_CONNTRACK \
            --enable CONFIG_NF_CONNTRACK_IPV4 \
            --enable CONFIG_NF_CONNTRACK_IPV6

      - name: Apply custom drivers config
        run: |
          cd kernel
          [ -f "${{ env.DRIVERS_CONFIG }}" ] && cat "${{ env.DRIVERS_CONFIG }}" >> out/.config || echo "No custom drivers config found"

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create NetHunter flashable package
        run: |
          mkdir -p nethunter-package
          cp kernel/out/arch/arm64/boot/Image.gz-dtb nethunter-package/
          # Basic packaging for Realme 8
          cd nethunter-package
          echo "Creating basic flashable zip..."
          zip -r9 nethunter-${{ env.DEVICE_CODENAME }}-kernel.zip *
          echo "Package created: nethunter-${{ env.DEVICE_CODENAME }}-kernel.zip"

      - name: Make a release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            nethunter-package/nethunter-${{ env.DEVICE_CODENAME }}-kernel.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          name: NetHunter Kernel - ${{ env.VERSION }}
          tag_name: ${{ github.run_id }}
          body: |
             **Custom NetHunter Kernel for Realme 8 (nashc)**
             
             **Features:**
             - Includes essential NetHunter functionality
             - Custom drivers from drivers.cfg
             - Built for ${{ env.VERSION }}
             
             **Installation:**
             1. For kernel only: flash Image.gz-dtb
             2. Full package: flash nethunter-*.zip in recovery
             
             **Note:** This is a custom build, not officially supported by NetHunter
          draft: false
          prerelease: false
