name: Realme 8 NetHunter Kernel Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["LineageOS-20"]

    env:
      VERSION: ${{ matrix.version }}
      ARCH: arm64
      DEVICE_CODENAME: nashc
      CLANG_PATH: ${{ github.workspace }}/kernel/clang/bin
      DRIVERS_CONFIG: "${{ github.workspace }}/drivers.cfg"
      NH_DIR: "${{ github.workspace }}/nethunter"
      ANY_KERNEL_DIR: "${{ github.workspace }}/AnyKernel3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip jq zip unzip wget bc build-essential \
          ccache clang cmake flex g++ gcc git libncurses-dev libssl-dev \
          make python3 python3-dev rsync sed tar zlib1g-dev
          pip install yq --user

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          mkdir -p ${{ github.workspace }}/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Clone kernel sources
        run: |
          chmod +x clone.sh
          ./clone.sh

      - name: Add NetHunter config
        run: |
          echo "# NetHunter Core Config" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_OVERLAY_FS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_USB_LIBCOMPOSITE=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_HID=y" >> ${{ env.DRIVERS_CONFIG }}
          echo "CONFIG_HID_GENERIC=y" >> ${{ env.DRIVERS_CONFIG }}
          echo 'CONFIG_ATH9K_HTC_FW_PATH="ath9k_htc/htc_9271-1.4.0.fw"' >> ${{ env.DRIVERS_CONFIG }}

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 ${{ env.ANY_KERNEL_DIR }}
          cp ${{ github.workspace }}/anykernel.sh ${{ env.ANY_KERNEL_DIR }}/

      - name: Download WiFi firmware
        run: |
          mkdir -p ${{ env.ANY_KERNEL_DIR }}/firmware/ath9k_htc
          wget https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw \
          -O ${{ env.ANY_KERNEL_DIR }}/firmware/ath9k_htc/htc_9271-1.4.0.fw

      - name: Prepare AnyKernel package
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ${{ env.ANY_KERNEL_DIR }}/
          find kernel/out -name "*.ko" -exec cp {} ${{ env.ANY_KERNEL_DIR }}/modules/ \;
          
          # Modify anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' ${{ env.ANY_KERNEL_DIR }}/anykernel.sh
          sed -i "s/device.name1=.*/device.name1=${{ env.DEVICE_CODENAME }}/" ${{ env.ANY_KERNEL_DIR }}/anykernel.sh
          echo 'package_extract_dir("firmware", "/system/etc/firmware");' >> ${{ env.ANY_KERNEL_DIR }}/anykernel.sh

      - name: Create flashable zip
        run: |
          cd ${{ env.ANY_KERNEL_DIR }}
          zip -r9 ../nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d).zip *
          echo "FLASHABLE_ZIP=nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d).zip" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nethunter-${{ env.DEVICE_CODENAME }}-*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          name: NetHunter ${{ env.VERSION }} ($(date +%Y-%m-%d))
          tag_name: nethunter-${{ env.DEVICE_CODENAME }}-$(date +%Y%m%d)
          body: |
            **NetHunter Kernel for Realme 8 (nashc)**
            
            **Features:**
            - Full NetHunter compatibility
            - AnyKernel3 installation
            - Includes ath9k_htc firmware
            - Built with Clang
            
            **Installation:**
            1. Flash in TWRP recovery
            2. Reboot
            
            **Note:** Includes WiFi injection support for AR9271
          draft: false
          prerelease: false
