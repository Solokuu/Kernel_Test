### [CORE SYSTEM] ###
CONFIG_ANDROID=y
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_OVERLAY_FS=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y

### [NETWORKING] ###
CONFIG_NET=y
CONFIG_INET=y
CONFIG_NETFILTER=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_NETFILTER_XT_MATCH_SOCKET=y
CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y
CONFIG_IPV6=y
CONFIG_IPV6_MULTIPLE_TABLES=y

### [WIRELESS - MEDIATEK BUILT-IN] ###
CONFIG_WIRELESS=y
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_MTK_COMBO_WIFI=y
CONFIG_MTK_WIFI_MCC_SUPPORT=y
CONFIG_MTK_COMBO_WIFI_HIF=sdio
CONFIG_NL80211_TESTMODE=y

### [WIRELESS - TP-LINK TL-WN722N v1.1 (AR9271)] ###
CONFIG_ATH_COMMON=y
CONFIG_ATH9K_HTC=y                   # Dla TL-WN722N v1
CONFIG_ATH9K_HTC_FW_PATH="firmware/htc_9271.fw"
CONFIG_ATH9K_HTC_DEBUGFS=y
CONFIG_ATH9K_HWRNG=y
CONFIG_ATH9K_WIFI_INJECTION=y        # Wymagane do ataków
CONFIG_MAC80211_INJECTION=y
CONFIG_ATH9K_TX99=y                  # Tryb testowy TX
CONFIG_USB_NET_AX8817X=y             # Wsparcie USB-Ethernet

### [BLUETOOTH - MEDIATEK] ###
CONFIG_BT=y
CONFIG_BT_MTK=y
CONFIG_BT_MTKUART=y
CONFIG_BT_DEBUGFS=y
CONFIG_BT_HCIUART_3WIRE=y
CONFIG_BT_MTK_PSM_CONTROL=n          # Wyłącza oszczędzanie energii

### [USB GADGETS] ###
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_HID=y          # HID attacks
CONFIG_USB_CONFIGFS_F_HID_ALT=y
CONFIG_USB_CONFIGFS_F_PRINTER=y      # BadUSB
CONFIG_USB_CONFIGFS_F_MTP=y
CONFIG_USB_CONFIGFS_F_MIDI=y

### [SECURITY] ###
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_SECURITY_SELINUX=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_CBC=y
CONFIG_CRYPTO_XTS=y

### [KERNEL DEBUG] ###
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_INFO=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

### [HARDWARE SPECIFICS] ###
# Realme 8 (Helio G95)
CONFIG_MTK_SOC=y
CONFIG_MTK_CONN_LTE_IDC_SUPPORT=y
CONFIG_MTK_BTIF_CTRL_TC4=y

# Zewnętrzna karta WiFi
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_RNDIS_HOST=y
